<?xml version="1.0" encoding="UTF-8"?>
<svg width="640" height="1136" viewBox="0 0 640 1136" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="640" height="1136" fill="url(#bgGradient)"/>
  
  <!-- AIRA Logo -->
  <g transform="translate(320, 500)">
    <!-- Icon background -->
    <rect x="-80" y="-80" width="160" height="160" fill="#3b82f6" rx="24"/>
    
    <!-- AIRA Text -->
    <text 
      x="0" 
      y="20" 
      font-family="Arial, sans-serif" 
      font-size="56" 
      font-weight="bold" 
      fill="white" 
      text-anchor="middle"
    >AIRA</text>
    
    <!-- AI Symbol -->
    <g transform="translate(0, -40)">
      <circle cx="0" cy="0" r="6" fill="white" opacity="0.9"/>
      <circle cx="12" cy="0" r="4" fill="white" opacity="0.7"/>
      <circle cx="-12" cy="0" r="4" fill="white" opacity="0.7"/>
      <line x1="0" y1="0" x2="12" y2="0" stroke="white" stroke-width="2" opacity="0.7"/>
      <line x1="0" y1="0" x2="-12" y2="0" stroke="white" stroke-width="2" opacity="0.7"/>
    </g>
  </g>
  
  <!-- App Name -->
  <text 
    x="320" 
    y="700" 
    font-family="Arial, sans-serif" 
    font-size="32" 
    font-weight="600" 
    fill="white" 
    text-anchor="middle"
  >AIRA</text>
  
  <!-- Tagline -->
  <text 
    x="320" 
    y="740" 
    font-family="Arial, sans-serif" 
    font-size="16" 
    fill="#94a3b8" 
    text-anchor="middle"
  >AI-Powered Trading Platform</text>
  
  <!-- Loading indicator -->
  <g transform="translate(320, 900)">
    <circle cx="-30" cy="0" r="6" fill="#3b82f6" opacity="0.3">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle cx="0" cy="0" r="6" fill="#3b82f6" opacity="0.3">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="30" cy="0" r="6" fill="#3b82f6" opacity="0.3">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="1s"/>
    </circle>
  </g>
</svg>
